[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpw2"
version = "0.1.0"
description = "An independent IC-PW2 LAN client and desktop reference application"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "openpw2 contributors"}]
dependencies = ["cryptography>=44"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-qt>=4.4", "ruff>=0.9", "build>=1.2", "pyinstaller>=6.12"]

[project.gui-scripts]
openpw2 = "openpw2.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openpw2.gui" = ["*.qss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
